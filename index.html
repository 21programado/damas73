<script>
/*ENGINE*/
const DIRS=[[-1,-1],[-1,1],[1,-1],[1,1]];
const inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
function initBoard(){const b=new Array(64).fill(0);for(let r=0;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2){if(r<3)b[r*8+c]=-1;else if(r>4)b[r*8+c]=1;}return b;}
function jump(b,r,c,k,s,cap,path,cl,out,from){
  let any=false;
  for(const[dr,dc]of DIRS){
    if(!k&&dr!==-s)continue;
    let rr=r+dr,cc=c+dc;
    if(k)while(inb(rr,cc)&&b[rr*8+cc]===0){rr+=dr;cc+=dc;}
    if(!inb(rr,cc))continue;
    const ei=rr*8+cc;
    if(Math.sign(b[ei])!==-s||cap.has(ei))continue;
    let lr=rr+dr,lc=cc+dc;
    while(inb(lr,lc)&&b[lr*8+lc]===0){
      any=true;
      const nc=new Set(cap).add(ei),np=[...path,[lr,lc]],ncl=[...cl,ei];
      if(!k&&lr===(s===1?0:7))out.push({from,path:np,caps:ncl});
      else jump(b,lr,lc,k,s,nc,np,ncl,out,from);
      if(!k)break;
      lr+=dr;lc+=dc;
    }
  }
  if(!any&&cl.length)out.push({from,path,caps:cl});
}
function captures(b,s){
  const out=[];
  for(let i=0;i<64;i++){
    if(Math.sign(b[i])!==s)continue;
    const p=b[i];b[i]=0;
    jump(b,i>>3,i&7,Math.abs(p)===2,s,new Set(),[[i>>3,i&7]],[],out,i);
    b[i]=p;
  }
  return out;
}
function simple(b,s){
  const out=[];
  for(let i=0;i<64;i++){
    if(Math.sign(b[i])!==s)continue;
    const r=i>>3,c=i&7,k=Math.abs(b[i])===2;
    for(const[dr,dc]of DIRS){
      if(!k&&dr!==-s)continue;
      let rr=r+dr,cc=c+dc;
      while(inb(rr,cc)&&b[rr*8+cc]===0){
        out.push({from:i,path:[[r,c],[rr,cc]],caps:[]});
        if(!k)break;
        rr+=dr;cc+=dc;
      }
    }
  }
  return out;
}
function legal(b,s){const m=captures(b,s);return m.length?m:simple(b,s);}
function applyMove(b,m){
  const nb=b.slice(),p=nb[m.from];
  nb[m.from]=0;m.caps.forEach(i=>nb[i]=0);
  const[lr,lc]=m.path[m.path.length-1];
  nb[lr*8+lc]=(Math.abs(p)===1&&lr===(p>0?0:7))?2*p:p;
  return nb;
}
function evalB(b){
  let v=0;
  for(let i=0;i<64;i++){
    const p=b[i];if(!p)continue;
    const r=i>>3,c=i&7,s=Math.sign(p),cen=3-Math.abs(c-3.5)+0.5;
    let x;
    if(Math.abs(p)===2)x=330+cen*3+(3.5-Math.abs(r-3.5))*2;
    else{
      const adv=s===1?7-r:r;
      x=100+adv*5+cen*2;
      if(adv===0)x+=10;
    }
    v+=s*x;
  }
  return v;
}
let nodes=0;
function search(b,s,d,a,bt){
  nodes++;
  const ms=legal(b,s);
  if(!ms.length)return -9000-d;
  if(d<=0){
    if(!(ms[0].caps.length&&d>-4))return s*evalB(b);
  }
  let best=-Infinity;
  for(const m of ms){
    const v=-search(applyMove(b,m),-s,d-1,-bt,-a);
    if(v>best)best=v;
    if(best>a)a=best;
    if(a>=bt)break;
  }
  return best;
}
function aiMove(b,s){
  const ms=legal(b,s);
  if(ms.length===1)return ms[0];
  const cnt=b.filter(x=>x).length;
  const depth=cnt<=8?8:cnt<=14?7:6;
  let best=-Infinity;const sc=[];
  for(const m of ms){
    const v=-search(applyMove(b,m),-s,depth-1,-Infinity,-(best-4));
    sc.push([m,v]);
    if(v>best)best=v;
  }
  const top=sc.filter(x=>x[1]>=best-3);
  return top[Math.floor(Math.random()*top.length)][0];
}
/*END*/
/*UI*/
const $=id=>document.getElementById(id);
const WM='w-[82%] h-[82%] rounded-full bg-primary shadow-[0_4px_12px_rgba(0,0,0,0.55)] flex items-center justify-center';
const BM='w-[82%] h-[82%] rounded-full bg-[#3b3e46] ring-1 ring-white/40 shadow-[0_3px_8px_rgba(0,0,0,0.65),0_0_10px_rgba(255,255,255,0.12)] flex items-center justify-center';
const seal='<div class="w-[70%] h-[70%] rounded-full bg-gradient-to-br from-secondary-fixed via-secondary to-secondary-container shadow-[0_1px_4px_rgba(0,0,0,0.4)] flex items-center justify-center"><span class="material-symbols-outlined text-surface-container-lowest text-[15px]" style="font-variation-settings:\'FILL\' 1;">workspace_premium</span></div>';
function pieceHTML(p,sel){
  const ring=sel?' ring-2 ring-secondary':'';
  if(p===1)return `<div class="${WM}${ring}"><div class="w-[72%] h-[72%] rounded-full bg-primary-fixed shadow-inner flex items-center justify-center"><div class="w-[50%] h-[50%] rounded-full bg-primary-fixed-dim"></div></div></div>`;
  if(p===-1)return `<div class="${BM}${ring}"><div class="w-[72%] h-[72%] rounded-full bg-[#1a1c20] shadow-inner flex items-center justify-center"><div class="w-[50%] h-[50%] rounded-full bg-[#5a5e68]"></div></div></div>`;
  if(p===2)return `<div class="w-[86%] h-[86%] rounded-full bg-primary shadow-[0_6px_20px_rgba(0,0,0,0.7),0_0_24px_rgba(233,193,118,0.35)] flex items-center justify-center${ring}"><div class="w-[76%] h-[76%] rounded-full bg-primary-fixed shadow-inner flex items-center justify-center">${seal}</div></div>`;
  return `<div class="w-[86%] h-[86%] rounded-full bg-[#3b3e46] ring-1 ring-white/40 shadow-[0_6px_20px_rgba(0,0,0,0.7),0_0_18px_rgba(233,193,118,0.25)] flex items-center justify-center${ring}"><div class="w-[76%] h-[76%] rounded-full bg-[#1a1c20] shadow-inner flex items-center justify-center">${seal}</div></div>`;
}
const sq=(r,c)=>'ABCDEFGH'[c]+(8-r);
let G;
function fresh(){return{b:initBoard(),turn:1,sel:null,step:0,taken:[],legalM:legal(initBoard(),1),capW:0,capB:0,last:null,ply:0,quiet:0,hist:[],busy:false,over:false,paused:false,secs:0};}
function snap(){return{b:G.b.slice(),capW:G.capW,capB:G.capB,last:G.last,ply:G.ply,quiet:G.quiet,secs:G.secs};}
function miniDiscs(n,dark){
  let h='';for(let i=0;i<n;i++)h+=dark?'<div class="w-4 h-4 rounded-full bg-[#3b3e46] ring-1 ring-white/40 shadow-sm flex items-center justify-center"><div class="w-2.5 h-2.5 rounded-full bg-[#1a1c20]"></div></div>':'<div class="w-4 h-4 rounded-full bg-primary-fixed shadow-sm flex items-center justify-center"><div class="w-2.5 h-2.5 rounded-full bg-primary-fixed-dim"></div></div>';
  return h;
}
function render(){
  let b=G.b;
  if(G.sel!==null&&G.step>0){b=b.slice();const p=b[G.sel];b[G.sel]=0;const[r,c]=G.taken[G.taken.length-1];b[r*8+c]=p;}
  const cur=G.step>0?G.taken[G.taken.length-1][0]*8+G.taken[G.taken.length-1][1]:G.sel;
  let h='';
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const i=r*8+c;
    if((r+c)%2===0){h+='<div class="aspect-square bg-surface-container-lowest"></div>';continue;}
    const lm=G.last&&(G.last.from===i||G.last.to===i);
    h+=`<div data-i="${i}" class="aspect-square bg-surface-container flex items-center justify-center relative cursor-pointer">${lm?'<div class="absolute inset-0 bg-secondary/10 pointer-events-none"></div>':''}${b[i]?pieceHTML(b[i],i===cur):''}</div>`;
  }
  $('grid').innerHTML=h;
  $('turno').textContent=`Partida Clásica • Turno ${Math.floor(G.ply/2)+1}`;
  $('ai-caps').innerHTML=miniDiscs(G.capB,false);$('ai-n').textContent=`Capturas (${G.capB})`;
  $('pl-caps').innerHTML=miniDiscs(G.capW,true);$('pl-n').textContent=`Capturas (${G.capW})`;
  $('last').textContent=G.last?G.last.txt:'ÚLTIMO: —';
  const adv=evalB(G.b)/100;$('adv').textContent=(adv>=0?'+':'')+adv.toFixed(1);
  $('undo').disabled=G.busy||G.over||!G.hist.length;
  $('ai-st').textContent=G.busy?'Calculando…':'Maestro • En espera';
  $('you-st').textContent=G.over?'Partida terminada':G.turn===1?'Blancas • Tu turno':'Blancas • Esperando';
}
function clock(){const m=String(Math.floor(G.secs/60)).padStart(2,'0'),s=String(G.secs%60).padStart(2,'0');$('clk').textContent=m+':'+s;}
let msgT;
function msg(t){$('you-st').textContent=t;clearTimeout(msgT);msgT=setTimeout(()=>{if(!G.over)$('you-st').textContent=G.turn===1?'Blancas • Tu turno':'Blancas • Esperando';},1800);}
function finish(m,text){
  const p=G.b[G.b.findIndex((x,i)=>i===m.path[m.path.length-1][0]*8+m.path[m.path.length-1][1])];
  const[lr,lc]=m.path[m.path.length-1];const to=lr*8+lc;
  const wasMan=Math.abs(G.b[m.from])===1;
  const crowned=wasMan&&Math.abs(applyMove(G.b,m)[to])===2;
  G.b=applyMove(G.b,m);
  if(m.caps.length){G.turn===1?G.capW+=m.caps.length:G.capB+=m.caps.length;}
  G.quiet=(m.caps.length||wasMan)?0:G.quiet+1;
  const[fr,fc]=m.path[0];
  G.last={from:m.from,to,txt:`ÚLTIMO: ${sq(fr,fc)} ➔ ${sq(lr,lc)}${m.caps.length?' (CAPTURA)':''}${crowned?' (CORONA)':''}`};
  G.ply++;G.turn=-G.turn;G.sel=null;G.step=0;G.taken=[];
  const ml=legal(G.b,G.turn);
  G.legalM=ml;
  if(!ml.length){end(G.turn===1?'Perdiste':'¡Ganaste!',G.turn===1?'La máquina te dejó sin movimientos.':'La máquina no tiene movimientos.');return;}
  if(G.quiet>=40){end('Tablas','20 jugadas de damas sin capturas ni avance de peones.');return;}
  render();
  if(G.turn===-1){G.busy=true;render();setTimeout(aiTurn,500);}
}
function aiTurn(){
  if(G.paused||G.over){if(!G.over)setTimeout(aiTurn,300);return;}
  const m=aiMove(G.b,-1);
  G.busy=false;finish(m);
}
function end(t,s){G.over=true;G.busy=false;render();$('ov-t').textContent=t;$('ov-s').textContent=s;$('ov').classList.remove('hidden');$('ov').classList.add('flex');}
function onClick(e){
  const cell=e.target.closest('[data-i]');
  if(!cell||G.turn!==1||G.busy||G.over||G.paused)return;
  const i=+cell.dataset.i,r=i>>3,c=i&7;
  if(G.b[i]>0){
    if(G.step>0){msg('Debés completar la captura');return;}
    const mine=G.legalM.filter(m=>m.from===i);
    if(!mine.length){msg(G.legalM[0]&&G.legalM[0].caps.length?'Captura obligatoria':'Esa ficha no puede moverse');return;}
    G.sel=G.sel===i?null:i;render();return;
  }
  if(G.sel===null)return;
  const cand=G.legalM.filter(m=>m.from===G.sel&&G.taken.every((t,k)=>m.path[k+1][0]===t[0]&&m.path[k+1][1]===t[1])&&m.path.length>G.step+1&&m.path[G.step+1][0]===r&&m.path[G.step+1][1]===c);
  if(!cand.length){msg(G.legalM[0]&&G.legalM[0].caps.length?'Captura obligatoria':'Movimiento no válido');return;}
  G.taken.push([r,c]);G.step++;
  const done=cand.find(m=>m.path.length-1===G.step);
  if(done){G.hist.push(snap());finish(done);}else render();
}
function newGame(){G=fresh();$('ov').classList.add('hidden');$('ov').classList.remove('flex');$('pause').lastElementChild.textContent='Pausa';render();clock();}
$('grid').addEventListener('click',onClick);
$('undo').onclick=()=>{
  if(G.busy||G.over||!G.hist.length)return;
  const s=G.hist.pop();Object.assign(G,s,{turn:1,sel:null,step:0,taken:[],legalM:legal(s.b,1)});render();clock();
};
$('pause').onclick=()=>{
  if(G.over)return;G.paused=!G.paused;
  $('pause').lastElementChild.textContent=G.paused?'Reanudar':'Pausa';
  $('pause').firstElementChild.textContent=G.paused?'play_arrow':'pause';
  $('board').style.opacity=G.paused?0.35:1;
};
$('draw').onclick=()=>{
  if(G.over||G.busy||G.paused||G.turn!==1)return;
  if(evalB(G.b)>=-100)end('Tablas','La máquina aceptó las tablas.');
  else{$('ai-st').textContent='Tablas rechazadas';setTimeout(render,1800);}
};
$('again').onclick=newGame;
setInterval(()=>{if(!G.paused&&!G.over){G.secs++;clock();}},1000);
newGame();
/*ENDUI*/
